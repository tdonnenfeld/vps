---
# web_phd — PhD Research Hub (Next.js journal + source-linked experiments + Quartz nginx)
#
# Clones the tdonnenfeld/web-phd project and deploys it at https://{{ subdomain_phd }}.{{ domain }}
# behind Traefik + Authelia (forward auth). Uses the existing stack Postgres
# (phd_hub database) and Vikunja on the stack_internal network.
#
# Prerequisites (manual, one-time on the host):
#   - SSH deploy key present at {{ phd_git_key_file }} with access to the repo
#   - DNS record {{ subdomain_phd }}.{{ domain }} -> {{ ansible_default_ipv4.address | default('185.196.20.127') }}

- name: Ensure PhD hub directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ phd_hub_dir }}"
    - "{{ phd_hub_dir }}/quartz/public"

- name: Create PhD experiment storage group
  ansible.builtin.group:
    name: phd-data
    system: true

- name: Create dedicated PhD experiment account
  ansible.builtin.user:
    name: phd-runner
    group: phd-data
    system: true
    create_home: true
    home: /var/lib/phd-runner
    shell: /bin/bash
    password_lock: true
  when: not ansible_check_mode

- name: Create private PhD data root
  ansible.builtin.file:
    path: /opt/services/phd-data
    state: directory
    owner: root
    group: phd-data
    mode: "0750"
  when: not ansible_check_mode

- name: Create dataset storage
  ansible.builtin.file:
    path: /opt/services/phd-data/datasets
    state: directory
    owner: "{{ admin_user }}"
    group: phd-data
    mode: "2750"
  when: not ansible_check_mode

- name: Create experiment output and workspace directories
  ansible.builtin.file:
    path: "/opt/services/phd-data/{{ item }}"
    state: directory
    owner: phd-runner
    group: phd-data
    mode: "2750"
  loop:
    - results
    - workspaces
  when: not ansible_check_mode

- name: Create runner installation directory
  ansible.builtin.file:
    path: /var/lib/phd-runner/actions-runner
    state: directory
    owner: phd-runner
    group: phd-data
    mode: "0750"
  when: not ansible_check_mode

- name: Check for installed GitHub runner service entry point
  ansible.builtin.stat:
    path: /var/lib/phd-runner/actions-runner/bin/runsvc.sh
  register: phd_runner_entrypoint

- name: Prepare GitHub runner service entry point
  ansible.builtin.copy:
    src: /var/lib/phd-runner/actions-runner/bin/runsvc.sh
    dest: /var/lib/phd-runner/actions-runner/runsvc.sh
    remote_src: true
    owner: phd-runner
    group: phd-data
    mode: "0750"
    force: false
  when: phd_runner_entrypoint.stat.exists and not ansible_check_mode

- name: Install private PhD runner systemd unit
  ansible.builtin.copy:
    src: phd-runner.service
    dest: /etc/systemd/system/phd-runner.service
    owner: root
    group: root
    mode: "0644"
  register: phd_runner_unit

- name: Reload systemd for PhD runner
  ansible.builtin.systemd:
    daemon_reload: true
  when: phd_runner_unit.changed and not ansible_check_mode

- name: Clone or update web-phd repository
  ansible.builtin.git:
    repo: "{{ phd_git_repo }}"
    dest: "{{ phd_hub_dir }}"
    version: main
    key_file: "{{ phd_git_key_file }}"
    accept_hostkey: true
  register: phd_git_result
  notify:
    - Recreate PhD web container
    - Recreate PhD Quartz container

- name: Render PhD hub .env
  ansible.builtin.template:
    src: phd.env.j2
    dest: "{{ phd_hub_dir }}/.env"
    mode: "0600"
  notify: Recreate PhD web container

- name: Check whether Quartz has generated a homepage
  ansible.builtin.stat:
    path: "{{ phd_hub_dir }}/quartz/public/index.html"
  register: phd_quartz_index

- name: Provide a private setup page until Quartz is built
  ansible.builtin.template:
    src: quartz-setup.html.j2
    dest: "{{ phd_hub_dir }}/quartz/public/index.html"
    mode: "0644"
  when: not phd_quartz_index.stat.exists

- name: Render PhD Compose override (read-only Obsidian vault)
  ansible.builtin.template:
    src: compose.override.yml.j2
    dest: "{{ phd_hub_dir }}/infrastructure/compose.override.yml"
    mode: "0644"

- name: Build PhD web image
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f infrastructure/compose.yml -f infrastructure/compose.override.yml build phd-web
    chdir: "{{ phd_hub_dir }}"
  # The image tag may change even when no Git/env template has changed;
  # the running container must be recreated to load the rebuilt image.
  changed_when: true
  when: not ansible_check_mode
  notify: Recreate PhD web container

- name: Install web-phd systemd unit
  ansible.builtin.template:
    src: web-phd.service.j2
    dest: /etc/systemd/system/web-phd.service
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start web-phd service
  ansible.builtin.systemd:
    name: web-phd
    state: started
    enabled: true


# Quartz is built from all approved Syncthing vault folders into a staging copy.
# The source vaults remain untouched and are never mounted into the web container.
- name: Ensure rsync is installed for safe Quartz staging
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Fetch pinned Quartz v4 source
  ansible.builtin.git:
    repo: https://github.com/jackyzha0/quartz.git
    dest: "{{ phd_hub_dir }}/data/quartz-source"
    version: v4.5.2
  when: not ansible_check_mode

- name: Configure private Quartz site and Catppuccin palette
  ansible.builtin.template:
    src: quartz.config.ts.j2
    dest: "{{ phd_hub_dir }}/data/quartz.config.ts"
    mode: "0644"
  when: not ansible_check_mode

- name: Install guarded Quartz build script
  ansible.builtin.copy:
    src: build-phd-quartz
    dest: /usr/local/sbin/build-phd-quartz
    mode: "0755"

- name: Install Quartz build systemd service
  ansible.builtin.template:
    src: phd-quartz-build.service.j2
    dest: /etc/systemd/system/phd-quartz-build.service
    mode: "0644"

- name: Install Quartz build systemd timer
  ansible.builtin.template:
    src: phd-quartz-build.timer.j2
    dest: /etc/systemd/system/phd-quartz-build.timer
    mode: "0644"

- name: Reload systemd for Quartz build units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable periodic private Quartz builds
  ansible.builtin.systemd:
    name: phd-quartz-build.timer
    enabled: true
    state: started
  when: not ansible_check_mode


- name: Install private Quartz asset health check
  ansible.builtin.copy:
    src: verify-phd-quartz-assets
    dest: /usr/local/sbin/verify-phd-quartz-assets
    mode: "0755"

# The rebuild task notifies a handler, so flush it before testing the newly
# created container rather than the old production image.
- name: Apply pending PhD container refresh before checking Knowledge assets
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Verify Quartz assets through the freshly deployed Next.js proxy
  ansible.builtin.command: /usr/local/sbin/verify-phd-quartz-assets
  changed_when: false
  when: not ansible_check_mode
