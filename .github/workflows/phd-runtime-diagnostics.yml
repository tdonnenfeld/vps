name: PhD runtime diagnostics
on:
  pull_request:
    paths:
      - "ansible/roles/web_phd/**"
      - ".github/workflows/phd-runtime-diagnostics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH key
        env:
          PALMA_DEPLOY_KEY: ${{ secrets.PALMA_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PALMA_DEPLOY_KEY" > ~/.ssh/palma_ci
          chmod 600 ~/.ssh/palma_ci
          ssh-keyscan -H 185.196.20.127 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect running configuration without revealing secrets
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/palma_ci theo@185.196.20.127 'sudo bash -se' <<'REMOTE'
          cd /opt/phd-hub
          container="$(docker compose --env-file .env -f infrastructure/compose.yml -f infrastructure/compose.override.yml ps -q phd-web)"
          test -n "$container"
          echo "Container running: yes"
          docker exec "$container" node -e 'console.log("GitHub runtime token configured:",Boolean(process.env.GITHUB_TOKEN?.trim()));console.log("Selected GitHub repos configured:",Boolean(process.env.GITHUB_REPOS?.trim()))'
          if [ -s /opt/phd-hub/quartz/public/index.html ]; then
            echo "Quartz homepage present: yes"
          else
            echo "Quartz homepage present: no"
          fi
          vault="/opt/services/shared/obsidian/vaults/PhD"
          if [ -d "$vault" ]; then
            echo "PhD vault accessible: yes"
            echo "Markdown files in PhD vault: $(find "$vault" -type f -iname '*.md' | wc -l)"
            echo "Daily notes named YYYY-MM-DD.md: $(find "$vault" -type f -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}\\.[mM][dD]' | wc -l)"
          else
            echo "PhD vault accessible: no"
            exit 1
          fi
          root="/opt/services/shared/obsidian/vaults"
          echo "=== Dated-note filename patterns by Obsidian vault (counts only) ==="
          for vault in "$root"/*/; do
            [ -d "$vault" ] || continue
            files="$(find "$vault" -type f -iname '*.md' -printf '%f\\n')"
            exact="$(printf '%s\\n' "$files" | grep -Ec '^[0-9]{4}-[0-9]{2}-[0-9]{2}\\.md || true)"
            dated="$(printf '%s\\n' "$files" | grep -Ec '[0-9]{4}[-_.][0-9]{2}[-_.][0-9]{2}|[0-9]{2}[-_.][0-9]{2}[-_.][0-9]{4}|[0-9]{8}' || true)"
            echo "Vault $(basename "$vault"): exact_iso=$exact any_date_pattern=$dated"
          done
          REMOTE
