name: PhD runtime diagnostics
on:
  pull_request:
    paths:
      - "ansible/roles/web_phd/**"
      - ".github/workflows/phd-runtime-diagnostics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH key
        env:
          PALMA_DEPLOY_KEY: ${{ secrets.PALMA_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PALMA_DEPLOY_KEY" > ~/.ssh/palma_ci
          chmod 600 ~/.ssh/palma_ci
          ssh-keyscan -H 185.196.20.127 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect running configuration without revealing secrets
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/palma_ci theo@185.196.20.127 'sudo bash -se' <<'REMOTE'
          cd /opt/phd-hub
          container="$(docker compose --env-file .env -f infrastructure/compose.yml -f infrastructure/compose.override.yml ps -q phd-web)"
          test -n "$container"
          echo "Container running: yes"
          docker exec "$container" node -e 'console.log("GitHub runtime token configured:",Boolean(process.env.GITHUB_TOKEN?.trim()));console.log("Selected GitHub repos configured:",Boolean(process.env.GITHUB_REPOS?.trim()))'
          if [ -s /opt/phd-hub/quartz/public/index.html ]; then
            echo "Quartz homepage present: yes"
          else
            echo "Quartz homepage present: no"
          fi
          echo "=== Quartz source and output ==="
          vault_root=/opt/services/shared/obsidian/vaults
          public=/opt/phd-hub/quartz/public
          if [ -d "$vault_root" ]; then
            echo "Vault directories: $(find "$vault_root" -mindepth 1 -maxdepth 1 -type d ! -name '.*' | wc -l)"
            echo "Source Markdown files: $(find "$vault_root" -type f \( -iname '*.md' \) | wc -l)"
          else
            echo "Vault root missing"
          fi
          if [ -s "$public/index.html" ]; then
            echo "Published homepage: present"
            if grep -qi 'Knowledge base not published yet\|Knowledge base not built yet' "$public/index.html"; then
              echo "Published homepage: SETUP PLACEHOLDER, not a completed Quartz build"
            else
              echo "Published homepage: not the setup placeholder"
            fi
          else
            echo "Published homepage: missing"
          fi
          echo "Published HTML pages: $(find "$public" -type f -name '*.html' 2>/dev/null | wc -l)"
          echo "Published CSS files: $(find "$public" -type f -name '*.css' 2>/dev/null | wc -l)"
          echo "Published JS files: $(find "$public" -type f -name '*.js' 2>/dev/null | wc -l)"

          echo "=== Quartz build service ==="
          echo "Build service state: $(systemctl show phd-quartz-build.service --property=ActiveState --value)"
          echo "Build service result: $(systemctl show phd-quartz-build.service --property=Result --value)"
          echo "Build service exit status: $(systemctl show phd-quartz-build.service --property=ExecMainStatus --value)"
          echo "Build timer state: $(systemctl show phd-quartz-build.timer --property=ActiveState --value)"
          echo "Build timer enabled: $(systemctl is-enabled phd-quartz-build.timer || true)"

          echo "=== Private HTTP routing ==="
          docker exec -i "$container" node - <<'NODE'
          const routes = ["/knowledge","/knowledge/","/knowledge/index.html"];
          (async()=>{for(const route of routes){
            try {const r=await fetch("http://127.0.0.1:3000"+route,{headers:{"Remote-User":process.env.ALLOWED_USER||""},redirect:"manual",signal:AbortSignal.timeout(10000)});
              console.log("App route",route,": HTTP",r.status,"type:",r.headers.get("content-type"),"location:",r.headers.get("location"));
            } catch(e) {console.log("App route",route,": failed:",e.name);}
          }})().catch(()=>process.exitCode=1);
          NODE
          REMOTE
